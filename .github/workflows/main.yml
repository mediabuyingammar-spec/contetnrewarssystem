name: Post next clip

on:
  workflow_dispatch:
  schedule:
    # Runs hourly. The script itself only posts when ~5 hours have passed since the last post,
    # which avoids the uneven gaps a "*/5" cron produces at midnight UTC.
    - cron: "7 * * * *"

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POST_EVERY_HOURS: ${{ vars.POST_EVERY_HOURS || '5' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'public' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'SELF_ONLY' }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-post.txt

      - run: pip install -r requirements-post.txt

      - name: Is a post due?
        id: due
        run: python main.py is-due

      - name: Find next clip
        id: next
        if: steps.due.outputs.due == 'true'
        run: echo "name=$(python main.py next-clip)" >> "$GITHUB_OUTPUT"

      - name: Download clip from release
        if: steps.next.outputs.name != ''
        run: gh release download clips --pattern "${{ steps.next.outputs.name }}" --dir data/clips --clobber

      - name: Post to YouTube, TikTok and Instagram
        id: post
        if: steps.next.outputs.name != ''
        run: python main.py post-if-due

      - name: Remove posted clip from release
        if: steps.post.outputs.posted != ''
        run: gh release delete-asset clips "${{ steps.post.outputs.posted }}" --yes || true

      - name: Save pipeline state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.db
          if ! git diff --cached --quiet; then
            git commit -m "Update pipeline state (post)"
            git push
          fi
